<!DOCTYPE html>
<html lang="fr">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Docteur — Cortex Personnel</title>

    <!-- PWA — manifest and SW registration injected by vite-plugin-pwa at build time -->
    <meta name="theme-color" content="#0a0814" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Docteur" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <!-- Fonts: NB-3 decision (option A) — no external font request. IBM Plex Mono / Space Grotesk are used
         if installed locally, otherwise the system stacks defined in tailwind.config.js / globals.css apply. -->
    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: #0a0814; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
