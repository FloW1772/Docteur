<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="40" fill="#0a0814"/>
  <!-- Brain outline -->
  <g transform="translate(96,96)">
    <!-- Left hemisphere -->
    <path d="M-8,-38 C-28,-38 -46,-28 -50,-10 C-54,6 -48,20 -40,28 C-34,34 -24,40 -14,42 L-14,46 L-8,46 L-8,-38 Z"
          fill="none" stroke="#3dffaa" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Right hemisphere -->
    <path d="M8,-38 C28,-38 46,-28 50,-10 C54,6 48,20 40,28 C34,34 24,40 14,42 L14,46 L8,46 L8,-38 Z"
          fill="none" stroke="#3dffaa" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Center line -->
    <line x1="0" y1="-38" x2="0" y2="46" stroke="#3dffaa" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- Neural connection dots -->
    <circle cx="-28" cy="-8" r="3.5" fill="#a78bfa"/>
    <circle cx="-36" cy="10" r="2.5" fill="#5ee7ff"/>
    <circle cx="-20" cy="22" r="3" fill="#a78bfa"/>
    <circle cx="28" cy="-8" r="3.5" fill="#a78bfa"/>
    <circle cx="36" cy="10" r="2.5" fill="#5ee7ff"/>
    <circle cx="20" cy="22" r="3" fill="#a78bfa"/>
    <!-- Neural lines -->
    <line x1="-28" y1="-8" x2="-36" y2="10" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>
    <line x1="-36" y1="10" x2="-20" y2="22" stroke="#5ee7ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="28" y1="-8" x2="36" y2="10" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>
    <line x1="36" y1="10" x2="20" y2="22" stroke="#5ee7ff" stroke-width="1.5" opacity="0.6"/>
    <!-- Bottom bar -->
    <rect x="-14" y="46" width="28" height="5" rx="2.5" fill="#3dffaa" opacity="0.7"/>
  </g>
</svg>
