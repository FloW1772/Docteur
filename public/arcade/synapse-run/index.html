<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- [GAME-2] Page-specific policy: no network, no plugins, no frames, no forms; only this folder's own CSS/JS.
     The page is always loaded inside <iframe sandbox="allow-scripts"> (opaque origin) by the Docteur Arcade host. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synapse Run — Arcade Docteur</title>
<link rel="stylesheet" href="./foundation.css">
</head>
<body>
<main class="sr-app" aria-labelledby="sr-title">
  <div class="sr-viewport" id="sr-viewport"></div>
  <header class="sr-hud">
    <h1 id="sr-title" class="sr-title">Synapse Run</h1>
    <p class="sr-stats"><span id="sr-distance">0 m</span><span id="sr-shards">0 éclat</span><span id="sr-score">Score 0</span></p>
  </header>
  <section class="sr-overlay" id="sr-overlay" aria-live="polite">
    <p class="sr-overlay-title" id="sr-overlay-title">Synapse Run</p>
    <p class="sr-overlay-text" id="sr-overlay-text">Chargement…</p>
    <button type="button" class="sr-action" id="sr-action" hidden>Démarrer</button>
    <p class="sr-keys">← → ou A D : couloir · ↑, W ou Espace : saut · ↓ ou S : glissade · Entrée : démarrer / rejouer</p>
  </section>
  <footer class="sr-footer">
    <p class="sr-status" id="sr-status" role="status">État : en attente de Docteur</p>
    <p class="sr-save" id="sr-save">Sauvegarde locale : non vérifiée</p>
    <p class="sr-note">Projet original · aucun réseau · aucune donnée Docteur</p>
  </footer>
</main>
<!-- [GAME-4] game.js (bundled game + three, built locally) runs first; foundation.js (host protocol) then sends READY. -->
<script src="./game.js"></script>
<script src="./foundation.js"></script>
</body>
</html>
