[package]
name = "docteur-voice"
version = "0.1.0"
description = "Icone barre des taches — dictee vocale locale vers Docteur"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                       = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification    = "2"
tauri-plugin-opener           = "2"
tauri-plugin-autostart         = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
# Async runtime + HTTP client for the local-only /api/todo call — Tauri's
# async_runtime::spawn() runs on the tokio runtime Tauri itself sets up, so
# tokio isn't a direct dependency here beyond what reqwest needs.
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Microphone capture (WASAPI on Windows) — no native SDK/CMake step required.
cpal  = "0.15"
hound = "3.5"

dirs = "5"
uuid = { version = "1", features = ["v4"] }
url  = "2"

[[bin]]
name = "docteur-voice"
path = "src/main.rs"
